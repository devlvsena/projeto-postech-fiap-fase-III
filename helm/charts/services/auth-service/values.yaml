# ---- ConfigMap ----
configMap:
  name: auth-service-config
  data:
    PORT: "8001"

# ---- Secrets ----
secrets:
  name: auth-service-secret
  type: Opaque
  data:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/auth_db"
    MASTER_KEY: "admin-secreto-123"

# ---- Deployment ----
deployment:
  replicaCount: 2
  image:
    repository: "auth-service"
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 5
    timeoutSeconds: 10

# ---- HPA ----
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

# ---- Service ----
service:
  enabled: true
  type: ClusterIP
  port: 8001
  targetPort: 8001
