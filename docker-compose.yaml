services:
  ministack:
    image: ministackorg/ministack
    container_name: ministack
    ports:
      - "4566:4566"
    networks:
      - kind

  stackport:
    image: davireis/stackport
    container_name: stackport
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - ministack
    networks:
      - kind

networks:
  kind:
    name: kind
    external: true