apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microsservices
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/gabrielyuto/projeto-postech-fiap-fase-III.git
        revision: main
        directories:
          - path: helm/charts/services/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/gabrielyuto/projeto-postech-fiap-fase-III.git
        targetRevision: main
        path: helm/charts/microsservice
        helm:
          releaseName: '{{.path.basename}}'
          valueFiles:
            # relativo ao source.path (o chart)
            - ../services/{{.path.basename}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: microsservices
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true