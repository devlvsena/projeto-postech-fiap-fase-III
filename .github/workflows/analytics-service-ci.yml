# ============================================
# WORKFLOW: CI Pipeline Analytics Service
# ============================================
name: 🔄 Analytics Service - CI

on:
  push:
    branches: [main]
    paths:
      - "toggle-master/microsservices/analytics-service-main/**"
      - ".github/workflows/analytics-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "toggle-master/microsservices/analytics-service-main/**"
      - ".github/workflows/analytics-service-ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"
  BUILD_CONTEXT: toggle-master/microsservices/analytics-service-main
  AWS_REGION: us-east-1
  AWS_ECR_REPOSITORY: analytics-service

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: VALIDAÇÃO (Paralelo)
  # ============================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toggle-master/microsservices/analytics-service-main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: toggle-master/microsservices/analytics-service-main/requirements*.txt
      
      - name: 📦 Install dependences for lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Flake8
        run: flake8 . --count --show-source --statistics

      - name: 🔍 Pylint
        run: pylint --recursive=y --fail-under=8.0 .
  
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: toggle-master/microsservices/analytics-service-main/requirements*.txt
      
      # ---------------- SCA ----------------
      - name: 🔒 SCA - pip-audit (informativo)
        working-directory: toggle-master/microsservices/analytics-service-main
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: 🛑 SCA - Trivy (bloqueia em CRITICAL)
        uses:  aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: toggle-master/microsservices/analytics-service-main
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # ---------------- SAST ----------------
      - name: 🛑 SAST - Bandit (bloqueia em HIGH)
        working-directory: toggle-master/microsservices/analytics-service-main
        run: |
          pip install bandit
          bandit -r . --severity-level high -x ./tests,./.venv

  # ============================================
  # STAGE 2: BUILD (sem credenciais AWS)
  # ============================================
  build:
    name: 🏗️ Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: [lint, security]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Configurar credenciais AWS (lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry || 'local' }}/${{ env.AWS_ECR_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
