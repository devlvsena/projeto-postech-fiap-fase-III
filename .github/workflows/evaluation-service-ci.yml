# ============================================
# WORKFLOW: CI Pipeline Evaluation Service
# ============================================
name: 🔄 Evaluation Service - CI

on:
  push:
    branches: [main]
    paths:
      - "toggle-master/microsservices/evaluation-service-main/**"
      - ".github/workflows/evaluation-service-ci.yml"
      - ".github/workflows/update-gitops.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "toggle-master/microsservices/evaluation-service-main/**"
      - ".github/workflows/evaluation-service-ci.yml"
      - ".github/workflows/update-gitops.yml"
      - ".github/scripts/**"
  workflow_dispatch:

env:
  GO_VERSION_FILE: toggle-master/microsservices/evaluation-service-main/go.mod
  BUILD_CONTEXT: toggle-master/microsservices/evaluation-service-main
  AWS_REGION: us-east-1
  AWS_ECR_REPOSITORY: evaluation-service

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: VALIDAÇÃO (Paralelo)
  # ============================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: toggle-master/microsservices/evaluation-service-main/go.sum

      - name: 🔍 golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: toggle-master/microsservices/evaluation-service-main
          args: --timeout=5m

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: toggle-master/microsservices/evaluation-service-main/go.sum

      # ---------------- SCA ----------------
      - name: 🔒 SCA - govulncheck (informativo)
        working-directory: toggle-master/microsservices/evaluation-service-main
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: 🛑 SCA - Trivy (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: toggle-master/microsservices/evaluation-service-main
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # ---------------- SAST ----------------
      - name: 🛑 SAST - gosec (bloqueia em HIGH)
        working-directory: toggle-master/microsservices/evaluation-service-main
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium -exclude-dir=vendor ./...

  # ============================================
  # STAGE 2: BUILD & PUSH
  # ============================================
  build:
    name: 🏗️ Build, Scan & Push (ECR)
    runs-on: ubuntu-latest
    needs: [lint, security]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ecr-registry: ${{ steps.ecr-login.outputs.registry }}
      image-tag: sha-${{ github.sha }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ 'local' }}/${{ env.AWS_ECR_REPOSITORY }}
          tags: |
            type=sha,format=long

      - name: 🏗️ Build Local Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛑 Container Scan - Trivy (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ 'local' }}/${{ env.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: 🔑 Configurar credenciais AWS (lab)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login no ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Push
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          LOCAL_TAG="${{ 'local' }}/${{ env.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPO="${{ env.AWS_ECR_REPOSITORY }}"
          TARGET_TAG="$ECR_REGISTRY/$ECR_REPO:sha-${{ github.sha }}"

          docker tag $LOCAL_TAG $TARGET_TAG

          docker push $TARGET_TAG

  update-gitops:
    name: Update GitOps
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/update-gitops.yml
    with:
      ecr-registry: ${{ needs.build.outputs.ecr-registry }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      service: evaluation-service
      source-sha: ${{ github.sha }}