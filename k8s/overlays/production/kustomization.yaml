apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base
  - db-init
  - ingress.yaml
  - middleware.yaml
  # Secrets criptografados com kubeseal; só o controller do cluster descriptografa.
  - sealed-secrets/auth-service-secret.yaml
  - sealed-secrets/flag-service-secret.yaml
  - sealed-secrets/targeting-service-secret.yaml
  - sealed-secrets/evaluation-service-secret.yaml
  - sealed-secrets/analytics-service-secret.yaml
  - sealed-secrets/postgres-admin-secret.yaml

# APP_ENV=production faz os serviços usarem os SDKs reais da AWS (sem
# endpoints locais). Secrets versionados como SealedSecrets (sealed-secrets/).
configMapGenerator:
  - name: evaluation-service-config
    behavior: merge
    literals:
      - APP_ENV=production
  - name: analytics-service-config
    behavior: merge
    literals:
      - APP_ENV=production

# Tags publicadas e imutaveis no ECR (SHA curto do commit do build).
images:
  - name: auth-service
    newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/auth-service
    newTag: "619d9c1"
  - name: flag-service
    newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/flag-service
    newTag: "619d9c1"
  - name: targeting-service
    newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/targeting-service
    newTag: "619d9c1"
  - name: evaluation-service
    newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/evaluation-service
    newTag: "619d9c1"
  - name: analytics-service
    newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/analytics-service
    newTag: "619d9c1"

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "2"
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"

replicas:
  - name: analytics-service
    count: 2
  - name: evaluation-service
    count: 2
  - name: auth-service
    count: 2
  - name: flag-service
    count: 2
  - name: targeting-service
    count: 2