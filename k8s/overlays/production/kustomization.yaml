apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

  # Secrets criptografados com kubeseal; só o controller do cluster descriptografa.
resources:
- namespace.yaml
- ../../base
- db-init
- ingress.yaml
- middleware.yaml
- sealed-secrets/auth-service-secret.yaml
- sealed-secrets/flag-service-secret.yaml
- sealed-secrets/targeting-service-secret.yaml
- sealed-secrets/evaluation-service-secret.yaml
- sealed-secrets/analytics-service-secret.yaml
- sealed-secrets/postgres-admin-secret.yaml

# APP_ENV=production faz os serviços usarem os SDKs reais da AWS (sem
# endpoints locais). Secrets versionados como SealedSecrets (sealed-secrets/).
configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=production
  name: evaluation-service-config
- behavior: merge
  literals:
  - APP_ENV=production
  name: analytics-service-config

# Tags publicadas e imutaveis no ECR (SHA curto do commit do build).
images:
- name: analytics-service
  newName: 761063914245.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  newTag: sha-994304473b165a91e1b6caf1549c26228aa81a82
- name: auth-service
  newName: 761063914245.dkr.ecr.us-east-1.amazonaws.com/auth-service
  newTag: sha-994304473b165a91e1b6caf1549c26228aa81a82
- name: evaluation-service
  newName: 042444213801.dkr.ecr.us-east-1.amazonaws.com/evaluation-service
  newTag: 619d9c1
- name: flag-service
  newName: 761063914245.dkr.ecr.us-east-1.amazonaws.com/flag-service
  newTag: sha-71a54f5354595c52606c6ca4d48c321e7409e910
- name: targeting-service
  newName: 761063914245.dkr.ecr.us-east-1.amazonaws.com/targeting-service
  newTag: sha-994304473b165a91e1b6caf1549c26228aa81a82

patches:
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "2"
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "2"
  target:
    kind: HorizontalPodAutoscaler

replicas:
- count: 2
  name: analytics-service
- count: 2
  name: evaluation-service
- count: 2
  name: auth-service
- count: 2
  name: flag-service
- count: 2
  name: targeting-service
