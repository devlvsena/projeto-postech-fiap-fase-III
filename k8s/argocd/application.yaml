apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gabrielyuto/projeto-postech-fiap-fase-III.git
    targetRevision: feature/argocd
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
