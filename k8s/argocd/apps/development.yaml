apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-development
  namespace: argocd               # a Application vive onde o Argo CD está
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
  source:
    repoURL: https://github.com/gabrielyuto/projeto-postech-fiap-fase-III.git
    targetRevision: main          # branch, tag ou SHA que o Argo CD acompanha
    path: k8s/overlays/development
  destination:
    server: https://kubernetes.default.svc   # "este mesmo cluster"
    namespace: development